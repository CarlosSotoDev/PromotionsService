# Sets the name of the application, in this case, to "PromotionsService"
spring.application.name=PromotionsService

# Sets the port for the application; 0 allows the application to choose a random available port
server.port=0

# Excludes DataSourceAutoConfiguration, as this service does not require a database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Eureka Configuration
# Configures a unique instance ID combining the application name, instance ID or random value, and port
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}:${server.port}}

# Sets the Eureka server URL for service registration and discovery (defaulting to localhost at port 8761)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Allows the application to register with the Eureka server
eureka.client.register-with-eureka=true

# Enables the application to retrieve registry information from Eureka
eureka.client.fetch-registry=true

# Instance Configuration
# Uses the IP address instead of hostname when registering with Eureka
eureka.instance.prefer-ip-address=true

# Sets the interval (in seconds) for lease renewal to keep the instance registered
eureka.instance.lease-renewal-interval-in-seconds=30

# Sets the expiration time (in seconds) for the lease if it?s not renewed
eureka.instance.lease-expiration-duration-in-seconds=90

# Logging Configuration
# Enables SQL-level logging for Hibernate with DEBUG level to view executed queries
logging.level.org.hibernate.SQL=DEBUG

# Sets TRACE-level logging to show detailed SQL parameter binding information
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
